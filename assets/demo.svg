<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="skill-oracle demo poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="35%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#79c0ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="84%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity=".22"/>
      <stop offset="65%" stop-color="#a371f7" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="52%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Courier New", Courier, monospace; }
      .small { font-size: 11px; letter-spacing: 3px; }
      .label { font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; }
      .title { font-size: 37px; font-weight: 700; letter-spacing: -1px; }
      .body { font-size: 15px; line-height: 1.45; }
      .tiny { font-size: 10px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="760" height="520" fill="url(#bg)" rx="12"/>
  <rect width="760" height="44" fill="#161b22" rx="12"/>
  <rect y="34" width="760" height="10" fill="#111827"/>
  <line x1="0" y1="44" x2="760" y2="44" stroke="#30363d" stroke-width="1"/>

  <circle cx="20" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="6" fill="#27c93f"/>
  <text x="380" y="27" class="mono small" text-anchor="middle" fill="#7d8590">SKILL-ORACLE · UPDATED DEMO</text>

  <rect x="0" y="0" width="760" height="520" fill="url(#glow-blue)"/>
  <rect x="0" y="0" width="760" height="520" fill="url(#glow-purple)"/>

  <g opacity=".10">
    <g stroke="#8b949e" stroke-width="1">
      <path d="M0 98H760M0 172H760M0 246H760M0 320H760M0 394H760M0 468H760"/>
      <path d="M96 44V520M184 44V520M272 44V520M360 44V520M448 44V520M536 44V520M624 44V520M712 44V520"/>
    </g>
  </g>

  <text x="18" y="102" class="mono" font-size="92" font-weight="700" fill="#e6edf3" opacity=".08">ORACLE</text>
  <text x="410" y="505" class="mono" font-size="68" font-weight="700" fill="#e6edf3" opacity=".06">MOTION / UI SHELL</text>

  <g>
    <text x="34" y="82" class="mono label" fill="#7ee787">&#x276F; bootstrap</text>
    <text x="34" y="122" class="mono title" fill="#f4f7fb">Find the right skill</text>
    <text x="34" y="160" class="mono title" fill="#f4f7fb">before the work starts.</text>
    <text x="34" y="194" class="mono body" fill="#c9d1d9">Updated routing now separates motion-driven UI shells</text>
    <text x="34" y="216" class="mono body" fill="#c9d1d9">from video motion and analytics noise.</text>

    <rect x="34" y="236" width="334" height="116" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="50" y="264" class="mono label" fill="#8b949e">user task</text>
    <text x="50" y="300" class="mono" font-size="19" fill="#f4f7fb">reestruturar a tela de login</text>
    <text x="50" y="327" class="mono" font-size="19" fill="#f4f7fb">e o dashboard com motion</text>

    <g opacity=".95">
      <rect x="50" y="364" width="70" height="28" rx="14" fill="#111827" stroke="#2f3d47"/>
      <text x="85" y="383" class="mono tiny" text-anchor="middle" fill="#7ee787">motion</text>

      <rect x="130" y="364" width="84" height="28" rx="14" fill="#111827" stroke="#2f3d47"/>
      <text x="172" y="383" class="mono tiny" text-anchor="middle" fill="#79c0ff">ui-shell</text>

      <rect x="224" y="364" width="84" height="28" rx="14" fill="#111827" stroke="#2f3d47"/>
      <text x="266" y="383" class="mono tiny" text-anchor="middle" fill="#f85149">security</text>

      <rect x="318" y="364" width="58" height="28" rx="14" fill="#111827" stroke="#2f3d47"/>
      <text x="347" y="383" class="mono tiny" text-anchor="middle" fill="#ffa657">fallback</text>
    </g>

    <rect x="34" y="408" width="334" height="10" rx="5" fill="#21262d"/>
    <rect x="34" y="408" width="258" height="10" rx="5" fill="url(#bar)"/>
    <rect x="287" y="399" width="12" height="28" rx="6" fill="#ffffff" opacity=".15" filter="url(#blur)"/>
  </g>

  <g>
    <rect x="404" y="78" width="326" height="208" rx="26" fill="#161b22" stroke="#30363d"/>
    <text x="425" y="104" class="mono label" fill="#8b949e">domain scan</text>
    <text x="425" y="141" class="mono body" fill="#c9d1d9">&gt; scanning 9,599 assets across 20 domains...</text>
    <text x="425" y="170" class="mono body" fill="#8b949e">detecting ui-shell / motion / login / dashboard intent</text>
    <text x="425" y="199" class="mono body" fill="#c9d1d9">routing to <tspan fill="#7ee787" font-weight="700">design-ui</tspan> and <tspan fill="#7ee787" font-weight="700">web-dev</tspan></text>
    <text x="425" y="228" class="mono body" fill="#8b949e">blocking stray analytics unless explicit signals appear</text>
    <text x="425" y="257" class="mono body" fill="#c9d1d9">fallback stays ready: <tspan fill="#7ee787" font-weight="700">find-skills</tspan></text>
  </g>

  <g>
    <rect x="404" y="302" width="326" height="142" rx="22" fill="#111827" stroke="#23303a"/>
    <text x="424" y="332" class="mono label" fill="#7ee787">routing</text>
    <rect x="424" y="350" width="92" height="22" rx="11" fill="#111827" stroke="#79c0ff"/>
    <text x="470" y="365" class="mono tiny" text-anchor="middle" fill="#79c0ff">oracle-master-web</text>
    <rect x="522" y="350" width="98" height="22" rx="11" fill="#111827" stroke="#ffa657"/>
    <text x="571" y="365" class="mono tiny" text-anchor="middle" fill="#ffa657">oracle-master-design</text>
    <rect x="626" y="350" width="86" height="22" rx="11" fill="#111827" stroke="#f85149"/>
    <text x="669" y="365" class="mono tiny" text-anchor="middle" fill="#f85149">security</text>
    <text x="424" y="396" class="mono body" fill="#c9d1d9">Motion gets its own lane. UI shell stays on design and web.</text>
    <text x="424" y="420" class="mono body" fill="#c9d1d9">No match? The fallback stays visible instead of pretending.</text>
  </g>

  <g filter="url(#soft)">
    <circle cx="92" cy="93" r="66" fill="#79c0ff" opacity=".13"/>
    <circle cx="652" cy="124" r="58" fill="#a371f7" opacity=".12"/>
  </g>

  <g>
    <text x="34" y="486" class="mono tiny" fill="#c9d1d9">skill-oracle / updated poster</text>
    <text x="515" y="486" class="mono tiny" fill="#79c0ff">v2.4.14</text>
    <text x="571" y="486" class="mono tiny" fill="#c9d1d9">/ release asset</text>
  </g>
</svg>
